<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erreur · Trophée')}"></head>
<body class="anim">

<div th:replace="~{fragments/layout :: sidebar('')}"></div>

<div class="app-main">
    <header th:replace="~{fragments/layout :: topbar('Erreur ' + ${status})}"></header>

    <main class="content">
        <section class="card collision">
            <div class="card-head">
                <h2><span class="kicker">⚠</span><span th:text="${status} ?: 'Erreur'">500</span></h2>
            </div>
            <div class="card-body">
                <p style="font-size:17px" th:text="${error} ?: 'Une erreur est survenue.'">Erreur</p>
                <p class="muted" th:if="${message}" th:text="${message}">Détail</p>
                <div class="btn-row mt">
                    <a href="/" class="btn btn-primary">Retour à l'accueil</a>
                    <a href="/tournaments" class="btn btn-ghost">Liste des tournois</a>
                </div>
            </div>
        </section>
    </main>
</div>

</body>
</html>
