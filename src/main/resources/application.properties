spring.application.name=tournament-management

server.port=8081

# ---- Data source (H2, file based) ----
spring.datasource.url=jdbc:h2:file:./data/tournamentdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 console ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Logging ----
logging.level.org.hibernate.SQL=INFO
logging.level.com.example.tournament=INFO

# ---- Demo data ----
app.demo-data.enabled=true
app.demo-data.password=password